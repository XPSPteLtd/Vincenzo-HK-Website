name: Build check

# Hostinger builds and deploys the site itself (npm install + npm run build in
# its own pipeline, publishing dist/). This workflow does NOT deploy — it just
# builds the same way Hostinger does, so a broken build is caught here rather
# than by a failed deployment leaving the live site on stale files.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install --legacy-peer-deps

      - run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/menu/index.html
          test -f dist/robots.txt
          # .htaccess drives all routing on Hostinger — if Vite ever stops
          # copying it out of public/, every route except / would 404.
          test -f dist/.htaccess
          # IndexNow key file must contain the key, or Bing returns 403.
          test -s dist/b80d5e01376b4531a02a4770859569de.txt
          echo "Build output OK"
